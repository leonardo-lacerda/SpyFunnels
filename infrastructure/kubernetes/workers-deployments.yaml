apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawler-worker
  namespace: funnel-intelligence
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crawler-worker
  template:
    metadata:
      labels:
        app: crawler-worker
    spec:
      containers:
        - name: crawler
          image: your-registry/funnel-crawler:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: funnel-config
            - secretRef:
                name: funnel-secrets
---
