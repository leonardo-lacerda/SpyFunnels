apiVersion: apps/v1
kind: Deployment
metadata:
  name: funnel-api
  namespace: funnel-intelligence
spec:
  replicas: 2
  selector:
    matchLabels:
      app: funnel-api
  template:
    metadata:
      labels:
        app: funnel-api
    spec:
      containers:
        - name: api
          image: your-registry/funnel-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: funnel-config
            - secretRef:
                name: funnel-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: funnel-api
  namespace: funnel-intelligence
spec:
  selector:
    app: funnel-api
  ports:
    - port: 80
      targetPort: 3001
      protocol: TCP
  type: ClusterIP

